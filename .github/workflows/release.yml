name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6

      - name: "Install Nix"
        uses: DeterminateSystems/nix-installer-action@v21

      - name: "Build container image"
        run: nix build

      - name: "Extract version from tag"
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: "Extract changelog"
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          version="${{ steps.version.outputs.version }}"
          body=$(awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          # Write to a temp file to avoid delimiter issues
          echo "$body" > /tmp/changelog-body.md

      - name: "Push container image to GHCR"
        run: |
          version="${{ steps.version.outputs.version }}"
          image_name="ghcr.io/${{ github.repository_owner }}/owndns"
          creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"

          skopeo copy --dest-creds="$creds" docker-archive:result "docker://${image_name}:${version}"
          skopeo copy --dest-creds="$creds" docker-archive:result "docker://${image_name}:latest"

      - name: "Create GitHub Release"
        run: |
          gh release create "$GITHUB_REF_NAME" result \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/changelog-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
