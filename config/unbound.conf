server:
  module-config: "respip validator iterator"

  interface: 0.0.0.0
  port: 53

  # Root files for recursive resolution and DNSSEC validation.
  auto-trust-anchor-file: "/var/lib/unbound/root.key"
  root-hints: "/etc/unbound/root.hints"

  # Security & Privacy
  hide-identity: yes
  hide-version: yes

  # Performance
  cache-min-ttl: 300
  infra-keep-probing: yes
  msg-cache-size: 128m
  num-threads: 2
  outgoing-num-tcp: 32
  prefetch-key: yes
  prefetch: yes
  rrset-cache-size: 256m
  serve-expired: yes

  # Disable internal chroot and uid switch.
  chroot: ""
  username: ""

  # Logging
  log-time-ascii: yes
  logfile: ""

  # Allow common private IPs.
  access-control: 10.0.0.0/8 allow
  access-control: 127.0.0.0/8 allow
  access-control: 169.254.0.0/16 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow

  # DNS rebinding protection.
  private-address: 10.0.0.0/8
  private-address: 127.0.0.0/8
  private-address: 169.254.0.0/16
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16

remote-control:
  control-enable: yes
  control-interface: /run/unbound/control.sock

rpz:
  name: "hagezi-ndr"
  zonefile: "/etc/unbound/rpz/ndr.txt"

rpz:
  name: "hagezi-pro"
  zonefile: "/etc/unbound/rpz/pro.txt"

rpz:
  name: "hagezi-tif"
  zonefile: "/etc/unbound/rpz/tif.txt"

rpz
  name: "hegezi-tld"
  zonefile: "/etc/unbound/rpz/tld.txt"

