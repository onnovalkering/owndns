server:
  module-config: "respip validator iterator"

  interface: 0.0.0.0
  port: 53

  # Allow common internal container network and local ranges.
  access-control: 10.0.0.0/8 allow
  access-control: 127.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow

  # Root files for recursive resolution and DNSSEC validation.
  auto-trust-anchor-file: "/var/lib/unbound/root.key"
  root-hints: "/etc/unbound/root.hints"

  # Security & Privacy
  aggressive-nsec: yes
  harden-below-nxdomain: yes
  harden-dnssec-stripped: yes
  harden-glue: yes
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  use-caps-for-id: yes

  # Performance
  cache-max-ttl: 86400
  cache-min-ttl: 3600
  edns-buffer-size: 1232
  infra-cache-slabs: 4
  key-cache-slabs: 4
  msg-cache-size: 256m
  msg-cache-slabs: 4
  num-threads: 4
  prefetch-key: yes
  prefetch: yes
  rrset-cache-size: 512m
  rrset-cache-slabs: 4
  rrset-roundrobin: yes
  serve-expired-ttl: 3600
  serve-expired: yes

  # Disable internal chroot and uid switch.
  chroot: ""
  username: ""

  # Logging
  log-servfail: yes
  log-time-ascii: yes
  logfile: ""
  verbosity: 1

remote-control:
  control-enable: yes
  control-interface: /run/unbound/control.sock

rpz:
  name: "hagezi-pro"
  zonefile: "/etc/unbound/rpz/pro.txt"
  rpz-log: yes
  rpz-log-name: "hagezi-pro"

rpz:
  name: "hagezi-tif"
  zonefile: "/etc/unbound/rpz/tif.txt"
  rpz-log: yes
  rpz-log-name: "hagezi-tif"

